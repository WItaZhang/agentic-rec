name: ci

on:
  push:
    paths: ["agentic-rec/**", ".github/workflows/agentic-rec-ci.yml"]
  pull_request:
    paths: ["agentic-rec/**", ".github/workflows/agentic-rec-ci.yml"]

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: agentic-rec
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked --extra yaml --python ${{ matrix.python-version }}
      - run: uv run --locked --extra yaml --python ${{ matrix.python-version }} ruff check .
      - run: uv run --locked --extra yaml --python ${{ matrix.python-version }} python -m pytest
      - run: uv run --locked --extra yaml --python ${{ matrix.python-version }} python -m agentic_rec compare configs/*.toml --users 5 --items 60
