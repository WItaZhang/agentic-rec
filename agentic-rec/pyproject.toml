[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agentic-rec"
version = "0.1.0"
description = "A survey-derived, composable reference framework for agentic recommender systems."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Wita Zhang" }]
keywords = ["recommender systems", "llm agents", "agentic", "user simulation", "survey"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = []

[project.optional-dependencies]
yaml = [
    "pyyaml>=6",
]
dev = ["pytest>=7", "ruff>=0.4", "mypy>=1.8"]

[project.scripts]
agentic-rec = "agentic_rec.cli:main"

[project.urls]
Homepage = "https://github.com/witazhang/2/tree/main/agentic-rec"

[tool.setuptools.packages.find]
include = ["agentic_rec*"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true

[dependency-groups]
dev = [
    "pytest>=7",
    "ruff>=0.4",
]
