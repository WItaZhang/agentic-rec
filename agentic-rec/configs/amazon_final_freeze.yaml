planning:
  population: All eligible users in the predefined test interval; one hash-selected
    request per user
  sample_size_rationale: Use the complete available population, not a target-enriched
    subset; report uncertainty when predefined tolerance cannot be resolved
  primary_comparison_source: configs/amazon_routing_grid_v2.yaml
  selection_rule_source: configs/amazon_deployment_selection_v1.yaml
  sequence_extension: Conditional on evidence; no sequential acquisition implemented
    or claimed
  remaining_bindings: []
  freeze_requires: Complete main validation, real weighted router fit and registered
    practical method selection; all are verified complete
  order_adjustment: Freeze the already selected method and inference/analysis settings
    while diagnostic controls are running. Prepare target-free test inputs concurrently,
    but wait for completed diagnostics before any final paid generation or scoring.
    Controls cannot revise the registered grid, prompt, primary comparison, deployment
    selection or frozen artifacts.
  reason: The remaining controls diagnose sensitivity rather than select another candidate.
    Earlier irreversible selection freezing strengthens separation from their results
    and saves idle preparation time; no test labels have been scored.
