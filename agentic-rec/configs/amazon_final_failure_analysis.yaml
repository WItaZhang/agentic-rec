seed: 42
failure_analysis:
  policies:
  - fixed_R1
  - fixed_R4
  - rule_0.25
  - learned_0.25
  - rule_1.5
  - random_1.5
  - learned_1.5
  cases_per_class: 3
  history_items_per_case: 3
  matrix_run: logs/20261001_023000_amazon_final_test_evaluate
diagnostic_scope:
